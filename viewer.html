<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIB Collection</title><link rel="icon" href="mib-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="gallery.css"></head><body>
<main id="stage" aria-label="Model view"></main>
<header><a class="brand" href="index.html"><img src="mib-logo.svg" alt="MIB">MIB / Collection</a><h1 id="title">Opening model</h1><span id="status" role="status">Opening model…</span></header>
<nav id="tools" aria-label="View controls"><button id="fit">Fit</button><button id="reset">Original view</button><button id="perspective">3D</button><button id="plan">Plan</button><button id="walkBtn" aria-pressed="false">Walk</button><button id="controllerBtn">Controller</button><button id="originBtn" aria-pressed="false" title="Double-click to visit the origin">Origin</button><button id="roomLaunch">Room</button><button id="sniperLaunch">Keep watch</button><button id="tour" aria-pressed="false">Tour</button><button id="sound" aria-pressed="false">Sound</button><button id="pinsBtn" aria-pressed="true">Pins</button><button id="markupBtn" aria-pressed="false">Markup</button><label id="optionLabel" hidden>Design <select id="option"><option value="main">Original</option></select></label><a id="download">Save model ↓</a></nav>
<aside><details open><summary>Saved views</summary><div id="views"></div></details><div id="related"></div>
<details id="sunPanel"><summary>Sun and time</summary><div class="fields"><label>Sun <select id="sunMode"><option value="fixed">Fixed</option><option value="site">Date and time</option></select></label><label>Date <input id="sunDate" type="date"></label><label>Time <input id="sunTime" type="range" min="0" max="24" step="0.25"><output id="sunTimeLabel"></output></label><label>Latitude <input id="sunLat" type="number" min="-90" max="90" step="0.0001"></label><label>Longitude <input id="sunLon" type="number" min="-180" max="180" step="0.0001"></label><label>Time zone <input id="sunZone" type="number" min="-12" max="14" step="0.5"></label><label>Strength <input id="sunStrength" type="range" min="0" max="2" step="0.05"></label><label>Sky light <input id="skyStrength" type="range" min="0" max="2" step="0.05"></label><label>Exposure <input id="exposure" type="range" min="0.2" max="2" step="0.05"></label><label>Reflections <input id="reflections" type="range" min="0" max="2" step="0.05"></label><label>Glow <input id="glowGain" type="range" min="0" max="4" step="0.05"></label><label>Backdrop <select id="backdrop"><option value="plain">Plain</option><option value="sky">Sky</option></select></label><label><input id="shadows" type="checkbox">Shadows</label><button id="sunReset">Original lighting</button></div></details>
<details id="infoPanel" open hidden><summary>Selection</summary><p id="selection"></p><dl id="properties"></dl><button id="clearSelection">Clear selection</button></details><p id="error" role="alert" hidden></p><button id="retry" hidden>Retry</button></aside>
<div id="walkCross" hidden>+</div><div id="walkHud"></div><div id="toast" role="status" hidden></div>
<div id="markupTools" hidden><button data-mark="pen" aria-pressed="true">Pen</button><button data-mark="line">Line</button><button data-mark="arrow">Arrow</button><button data-mark="rect">Rectangle</button><input id="markColour" type="color" value="#d94632" aria-label="Markup colour"><button id="markUndo">Undo</button><button id="markClear">Clear</button><button id="markExport">Save image</button><button id="markDone">Done</button></div><svg id="markupLayer" xmlns="http://www.w3.org/2000/svg" hidden></svg>
<script type="module" src="gallery.js"></script></body></html>
